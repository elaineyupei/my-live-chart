<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>杨千嬅 Live 影响力系数榜 · Miriam Yeung's Live Impact Index</title>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e8e8ec;
  --hot:#866cb5; --warm:#8f7cc0; --cool:#8e8e93; --soft:#f7f7f8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
header{padding:26px 0 14px}
h1{margin:0 0 2px;font-size:22px;letter-spacing:.5px}
.title-en{margin:0;color:var(--muted);font-size:12.5px;letter-spacing:.2px}
.sub{margin:0;color:var(--muted);font-size:13px}
.note{margin:12px 0 0;padding:10px 12px;background:#f6f3fb;border:1px solid #ddd3ec;
  border-radius:9px;color:#503c80;font-size:12.5px;line-height:1.6}
.bar-top{position:sticky;top:0;z-index:9;background:var(--bg);
  padding:10px 0;border-bottom:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
/* 排序依据 + 升降序 成对成组：窄屏换行时同进同退，升降序不会独自落单 */
.sgrp{display:flex;align-items:flex-end;gap:8px;flex:0 0 auto}
input[type=search],select{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);outline:none;min-height:40px}
input[type=search]{flex:1 1 150px;min-width:0}
input[type=search]:focus,select:focus{border-color:var(--hot)}
select{flex:0 0 auto}
.dirbtn{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;flex:0 0 auto;
  min-height:40px;white-space:nowrap;transition:border-color .15s,color .15s}
.dirbtn:hover,.dirbtn:focus{border-color:var(--hot);color:var(--hot);outline:none}
.count{color:var(--muted);font-size:12.5px;padding:8px 2px 2px}
.row{background:var(--card);border-radius:11px;padding:11px 13px;margin-bottom:8px;
  display:flex;align-items:center;gap:11px;cursor:pointer;border:1px solid transparent;
  transition:border-color .15s}
.row:active{border-color:var(--hot)}
/* 展开时吸顶：桌面「歌名 → 主题名」依次吸在工具栏下方；手机只吸歌名 */
.song.open > .row{position:sticky;top:var(--barh,0px);z-index:8;
  box-shadow:0 -1px 0 var(--card), 0 5px 12px -8px rgba(0,0,0,.22)}
@media (min-width:600px){
  /* 主题标题吸顶：加高 + 底部分隔线，跟场次列表区分开。
     padding-top 从 .tcard 挪到 .th 上 —— 否则吸顶时 .tcard 那 9px 会在标题上方露出滚动内容 */
  .tcard.open{padding-top:0}
  .tcard.open > .th{position:sticky;top:calc(var(--barh,0px) + var(--rowh,0px));
    z-index:7;background-color:var(--card);padding:11px 4px 9px;
    box-shadow:0 1px 0 var(--line), 0 6px 10px -9px rgba(0,0,0,.2)}
}
.rk{flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;
  color:var(--cool);font-size:14px}
.rk.top{color:var(--hot)}
.nm{flex:1 1 auto;min-width:0}
.nmh{display:flex;align-items:center;gap:7px;min-width:0}
.nmh b{flex:0 1 auto;min-width:0;display:block;font-weight:600;font-size:15.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12px}
/* 唱片公司标签：极淡底 + 同色系深字（颜色映射见 JS LAB_COLOR）。
   窄屏时从歌名旁挪到第二行行首（.lab-d 隐藏、.lab-m 显示），避免挤压歌名 */
.lab{flex:0 0 auto;font-size:10.5px;line-height:1;padding:2px 6px;border-radius:4px;
  white-space:nowrap;font-weight:500}
.lab-m{display:none}
@media (max-width:600px){
  .lab-d{display:none}
  .lab-m{display:inline-block;margin-right:6px}
}
.cf{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.cf small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.meter{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--warm),var(--hot))}
.detail{background:var(--card);border-radius:11px;padding:2px 20px 15px;margin:-4px 0 8px;
  border:1px solid var(--line);border-top:none}
.meta{color:var(--muted);font-size:13px;padding:10px 0 4px;line-height:1.75}
.meta b{color:var(--ink);font-weight:600}
.fbox{margin:11px 0;padding:11px 12px;background:var(--soft);border-radius:9px;
  font-size:13px;line-height:1.75;font-variant-numeric:tabular-nums}
.fbox .fx{color:var(--muted);font-size:12px;margin-bottom:6px}
.fbox .res{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:700}
.tlist{margin-top:6px}
.tcard{padding:9px 0;border-bottom:1px solid var(--line);border-radius:7px;
  transition:border-color .15s,box-shadow .15s}
.tcard:last-child{border-bottom:none}
.tcard.open{border-color:var(--hot);box-shadow:0 0 0 1.5px rgba(134,108,181,.12)}
.th{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 4px;
  user-select:none;border-radius:5px;transition:background .12s}
.th:hover{background:rgba(134,108,181,.05)}
.th .arr{font-size:9px;color:var(--hot);flex-shrink:0;transition:transform .15s}
.tcard.open .th .arr{transform:rotate(90deg)}
.th .tn{font-weight:600;font-size:14px;flex:1 1 auto;min-width:0;
  overflow-wrap:break-word;white-space:normal}
.th .tv{font-variant-numeric:tabular-nums;font-weight:700;color:var(--hot);font-size:14px;flex-shrink:0}
.th .cnt{font-size:11px;padding:1px 7px;border-radius:10px;background:var(--soft);
  color:var(--hot);flex-shrink:0;font-weight:500}
.tcard.open .th .cnt{background:var(--hot);color:#fff}
.tcard-body{display:none;margin-top:6px}
.tcard.open .tcard-body{display:block}
.tm{color:var(--muted);font-size:12.5px;margin-top:3px;font-variant-numeric:tabular-nums}
.tb{height:3px;border-radius:2px;background:var(--line);margin:6px 0 5px;overflow:hidden}
.tb i{display:block;height:100%;background:var(--warm)}
.td{color:var(--ink);font-size:13px;line-height:1.7}
/* 统一两列：左列年份行／右列城市场馆，所有块起点一致；窄屏并成单列，城市场馆掉到下方 */
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);
  gap:6px 24px;align-items:center;
  padding:5px 0;border-top:1px dashed var(--line)}
.loc:first-of-type{border-top:none;padding-top:0}
.loc-rows{min-width:0;display:flex;flex-direction:column;gap:4px}
.loc-row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.loc .yr{flex:0 0 36px;font-style:normal;font-size:13px;font-weight:600;color:var(--hot);
  font-variant-numeric:tabular-nums}
.loc .loc-v{min-width:0;
  display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.loc .loc-v b{font-size:13.5px;font-weight:600;color:var(--ink)}
.loc .loc-v b.none{color:var(--muted);font-weight:400}
.loc .loc-v i{font-style:normal;font-size:12.5px;color:var(--muted)}
.dgrid{flex:1 1 auto;min-width:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:2px 8px;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:380px){
  .loc{grid-template-columns:1fr}
  .loc .loc-v{padding-left:44px}
}
.tsort{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted)}
.tsort button{font:inherit;font-size:12px;padding:4px 12px;border:1px solid var(--line);
  border-radius:20px;background:var(--card);color:var(--muted);cursor:pointer}
.tsort button.on{border-color:var(--hot);color:var(--hot);font-weight:500}
.tnote{margin-top:6px;padding:7px 10px;background:#f6f3fb;border-radius:7px;
  color:#503c80;font-size:12.5px;line-height:1.65}
.empty{text-align:center;color:var(--muted);padding:44px 0;font-size:14px}
footer{margin-top:22px;color:var(--muted);font-size:11.5px;line-height:1.8;text-align:center}
/* 提示条内的算法入口链接 */
.note a{color:var(--hot);border-bottom:1px dotted var(--hot);text-decoration:none;font-weight:500;cursor:pointer}
/* 算法页返回入口 */
.alg-back{display:inline-block;margin-bottom:10px;color:var(--hot);
  border-bottom:1px dotted var(--hot);text-decoration:none;font-weight:500;font-size:13px;cursor:pointer}
/* 更新记录卡片 */
.log-card{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:14px 16px;margin-bottom:12px}
.log-card h3{margin:0 0 4px;font-size:15px;color:var(--ink)}
.log-card .log-date{color:var(--muted);font-size:12px;margin-bottom:10px}
.log-card ol{margin:0;padding-left:18px}
.log-card li{font-size:13px;line-height:1.7;margin-bottom:6px;color:var(--ink)}
.log-title{font-size:16px;font-weight:600;margin:0 0 12px}
.log-card.ack{background:rgba(134,108,181,0.06);border:1px solid rgba(134,108,181,0.25)}
.log-card.ack p{margin:0;font-size:14px;line-height:1.85;color:#866cb5}
.log-card.ack a{color:#6d56a3;font-weight:500}
.log-card.ack a:hover{color:#4a3a7a;text-decoration:underline}
/* 灰轨道分段控件：紫只染选中项，未选中走灰 */
.lang-sw{display:inline-flex;gap:3px;padding:3px;background:#F0F0F2;border-radius:9px}
.lang-sw button{font:inherit;font-size:12px;padding:4px 12px;border:1.5px solid transparent;
  border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-weight:400}
.lang-sw button.on{background:#fff;border-color:rgba(134,108,181,.18);color:#3C3489;font-weight:500}
/* 算法与口径视图 */
#alg-view{display:none;padding:10px 0}
.alg-sec{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:16px;margin-bottom:12px}
.alg-sec h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink)}
.alg-sec p{margin:0 0 7px;font-size:13px;line-height:1.8;color:var(--ink)}
.alg-sec p.muted{color:var(--muted);font-size:12.5px}
.alg-sec p.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--soft);padding:8px 10px;border-radius:7px;font-size:12.5px;
  line-height:1.7;white-space:pre-wrap;word-break:break-word;
  border-left:3px solid var(--warm)}
.alg-sec h4{margin:14px 0 6px;font-size:13px;font-weight:500;color:var(--ink);
  padding-left:10px;border-left:3px solid var(--warm)}
.alg-sec .li{margin:4px 0 4px 0;padding-left:16px;position:relative;font-size:13px;line-height:1.7}
.alg-sec .li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--warm)}
.alg-sec .kv-grid{margin:6px 0}
.alg-sec .kv-row{display:flex;gap:10px;align-items:baseline;padding:7px 11px;
  background:var(--soft);border-radius:7px;margin-bottom:4px;font-size:13px;line-height:1.6}
.alg-sec .kv-row b{color:var(--ink);font-weight:500;flex:0 0 88px}
.alg-sec .kv-row span{color:var(--muted);flex:1 1 auto;min-width:0}
.alg-sec .wt-table{margin:6px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.alg-sec .wt-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.alg-sec .wt-row:last-child{border-bottom:none}
.alg-sec .wt-row span{color:var(--ink)}
.alg-sec .wt-row b{color:var(--hot);font-weight:600;font-variant-numeric:tabular-nums}
.alg-sec .param-grid{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.alg-sec .param-cell{flex:1 1 86px;min-width:86px;display:flex;flex-direction:column;
  align-items:center;padding:10px 8px;background:var(--soft);border:1px solid var(--line);
  border-radius:9px;text-align:center}
.alg-sec .param-cell b{font-size:17px;font-weight:600;color:var(--hot);font-variant-numeric:tabular-nums;line-height:1.2}
.alg-sec .param-cell small{font-size:13px;color:var(--ink);font-weight:500;margin-top:4px}
.alg-sec .param-cell em{font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.alg-sec .score-scale{margin:6px 0}
.alg-sec .sc-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.alg-sec .sc-row b{flex:0 0 36px;color:var(--hot);font-weight:600;font-variant-numeric:tabular-nums}
.alg-sec .sc-bar{flex:1 1 auto;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.alg-sec .sc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--warm),var(--hot))}
.alg-sec .sc-row span{flex:0 0 auto;color:var(--muted)}
.alg-sec a{color:var(--hot);text-decoration:none;word-break:break-all;
  padding:1px 0;border-bottom:1px dotted var(--hot)}
.alg-sec a:active{background:rgba(134,108,181,.14)}
.alg-img-wrap{margin:14px 0;text-align:center}
.alg-img-wrap img{max-width:100%;border-radius:11px;border:1px solid var(--line);
  cursor:zoom-in;transition:transform .2s}
.alg-img-wrap img:active{transform:scale(1.02)}
.alg-img-cap{margin-top:8px;font-size:12px;color:var(--muted)}
.alg-img-overlay{display:none;position:fixed;z-index:99;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.9);cursor:zoom-out}
.alg-img-overlay img{max-width:95%;max-height:95%;position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);border-radius:8px}
.fld{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.fld>label{font-size:11px;color:var(--muted);padding-left:2px;letter-spacing:.3px;line-height:1.15;display:block}
/* 搜歌/搜幕后：与语言切换同一套灰轨道分段控件 */
.bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.paths{display:inline-flex;gap:3px;padding:3px;background:#F0F0F2;border-radius:9px}
.tgl{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:32px}
.tgl:hover{color:var(--hot);border-color:rgba(134,108,181,.35)}
.paths button{font:inherit;font-size:13px;padding:6px 14px;border:1.5px solid transparent;
  border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-weight:400}
.paths button.on{background:#fff;border-color:rgba(134,108,181,.18);color:#3C3489;font-weight:500}
.qwrap{position:relative;flex:1 1 150px;min-width:0}
.qwrap input{width:100%}
.acbox{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;
  background:#fff;border:1px solid var(--line);border-radius:9px;max-height:250px;
  overflow-y:auto;box-shadow:0 6px 20px rgba(0,0,0,.09)}
.acbox.on{display:block}
.acitem{padding:8px 12px;font-size:13.5px;cursor:pointer;display:flex;
  justify-content:space-between;gap:10px;align-items:baseline}
.acitem:hover{background:#f6f3fb}
.acitem .cn{color:var(--ink)}
.acitem .cc{color:var(--muted);font-size:12px;white-space:nowrap}
.wm-corner{position:fixed;bottom:14px;right:16px;font-size:14px;color:rgba(134,108,181,.55);
  z-index:9999;user-select:none;letter-spacing:.5px;font-weight:600;
  background:rgba(255,255,255,.85);padding:4px 8px;border-radius:5px;
  border:1px solid rgba(134,108,181,.15)}
.wm-corner a{color:inherit;text-decoration:none;opacity:.85}
.wm-corner a:hover{opacity:1;text-decoration:underline}
</style>
</head>
<body>
<div class="wm-corner" id="foot-corner"></div>
<div class="wrap">
<header>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="min-width:0">
      <h1 id="page-title">杨千嬅 Live 影响力系数榜</h1>
      <p class="title-en" id="title-en">Miriam Yeung's Live Impact Index</p>
    </div>
    <div class="lang-sw" style="margin-left:auto">
      <button id="lang-hant" onclick="setLang('hant')">繁體</button>
      <button id="lang-hans" class="on" onclick="setLang('hans')">简体</button>
    </div>
  </div>
  <p class="sub" id="sub"></p>
  <div class="note" id="note-box">
    <b id="note-title"></b><span id="note-body"></span>
  </div>
</header>

<div id="list-view">
<div class="bar-top">
  <div class="bar-head">
    <div class="paths">
      <button type="button" id="path-song" class="on" onclick="setPath('song')">搜歌</button>
      <button type="button" id="path-crew" onclick="setPath('crew')">搜幕后</button>
    </div>
    <button type="button" id="tools-toggle" class="tgl" onclick="toggleTools()"></button>
  </div>
  <div class="tools" id="tools">
    <div class="qwrap">
      <input type="search" id="q" autocomplete="off">
      <div class="acbox" id="ac"></div>
    </div>
    <div class="fld" id="fld-era"><label id="lbl-era"></label>
    <select id="era">
      <option value="" selected></option>
      <option value="199"></option>
      <option value="200"></option>
      <option value="201"></option>
      <option value="202"></option>
    </select></div>
    <div class="fld" id="fld-role" style="display:none"><label id="lbl-role"></label>
    <select id="role">
      <option value="" selected></option>
      <option value="1"></option>
      <option value="2"></option>
      <option value="4"></option>
      <option value="8"></option>
    </select></div>
    <div class="fld"><label id="lbl-scope"></label>
    <select id="scope">
      <option value="all"></option>
      <option value="ranked" selected></option>
      <option value="zero"></option>
    </select></div>
    <div class="sgrp"><div class="fld"><label id="lbl-sort"></label>
    <select id="sort">
      <option value="coef" selected></option>
      <option value="sess"></option>
      <option value="cnt"></option>
      <option value="year"></option>
      <option value="name"></option>
    </select></div>
    <button type="button" id="dir" class="dirbtn" title=""></button></div>
  </div>
  <div class="count" id="cnt"></div>
</div>
<div id="list"></div>
<footer id="footer"></footer>
</div>

<div id="alg-view">
  <a class="alg-back" onclick="switchView('list')" id="alg-back-link"></a>
  <div id="alg-content"></div>
</div>

<div id="log-view" style="display:none">
  <a class="alg-back" onclick="switchView('list')" id="log-back-link"></a>
  <div id="log-content"></div>
</div>

</div>

const ALG_T = {"sec1_title":"先說規則・哪些歌有資格參評","sec1_body":["總原則：只計「她自己的正式作品」。以下幾類由規則自動排除（無需人工挑選）：","li:① 非她主唱的歌（嘉賓合唱）","li:② 非歌曲（純音樂/intro/outro）","li:③ 翻唱他人作品——不論有無錄音室版本一律排除（另填新詞除外，如《掩眼法》）","li:④ 宣傳合作曲——以乙方身分參與、由外部機構主導，且未收錄於個人正式專輯（若收錄進個人專輯或屬其衍生版，如《處處吻》《初見》，則屬於她的正式作品，照常參評）","li:⑤ 大合唱（多人群星合唱，且未收錄於個人專輯）","li:※ 他人獨唱她的歌——仍保留一條演出記錄，但不計分。","h4:首現年份（時間資格）","li:① 首次公開演唱／首播（只唱片段／選段者不作準）","li:② 首次派台","li:③ 首張收錄載體發行","皆無→取首張收錄專輯發行年。只有此年之後的主題才計入係數計算。","通過資格的歌，在現收錄的 29 個演唱會主題上逐主題打分（持續新增）。"],"sec2_title":"第一步・單主題演唱會打分","sec2_body":["一個「主題」＝一次選曲決策；同一巡演跨年可拆成多個主題，逐個打分 0～1。","h4:① 看它怎麼被唱（數據來自逐場記錄的演出歌單）","kv:固定歌單|保證會唱，滿檔計（1.0）","kv:盲盒抽唱|Encore 隨機，打 β 折（0.9）","kv:選段|Medley／半首以上、<1首，打 γ 折（0.8，不疊加 β）","li:※ 不足半首或無準備的清唱——不計入演出場次。","h4:② 看它被唱了多少場","計算在所有場次中的加權頻率：","fx:基礎分 s ＝（固定×1 ＋ 盲盒×β ＋ 選段×γ）÷ 總場數 n；封頂 1","總場數 n＝1 即單場直接定分：固定＝1.0｜盲盒＝β＝0.9｜選段＝γ＝0.8","li:例：共 4 場＝固定 2 場＋盲盒 1 場 → s ＝（2×1 ＋ 1×0.9）÷ 4 ＝ 0.725","h4:③ 加分項：收錄進正版音像製品","＝她本人的 Live DVD／藍光／現場專輯。收錄後會被反覆回看、傳播更久 → 音像段位：主體段 ＋v、Encore 段 ＋v/2；碟越舊加分越少（每早一年 ×λ）。","li:※ 收錄門檻——須為正式出版，且被 Apple Music／Spotify 等主流串流平台收錄；MOOV 獨家、平台自製 Live 不計。","fx:單主題得分 ＝ 基礎分（加權頻率）＋ 音像加分 × λ^(今年−演唱會年份)，最高封頂 1 分","時間衰減：越老的演出與音像製品貢獻越小，但不清零。"],"sec3_title":"第二步・合成一個總分","sec3_body":["主題權重加權，疊加時間衰減。","h4:主題權重（四類）","wt:紅館／大型巡迴|1.0","wt:非主打歌演唱會|0.8","wt:個人小型音樂會|0.6","wt:合作音樂會／大於 5 場的海外巡迴|0.3","越近的演唱會分量越大：每早一年 ×λ。","h4:合成公式","fx:影響力係數 ＝ Σ（主題權重 × 單主題得分 × λ^(今年−演唱會年份)）÷ [ Σ（主題權重 × λ^(今年−演唱會年份)）＋ k ]","指數＝今年−演唱會年份；分子分母同乘 → 舊場貢獻變小但不清零。","li:※ 發行前的演唱會主題：權重記 0，分子分母都不進入計算","li:※ k 的作用是「防虛高」：只在小型主題唱過一次的歌，不會因分母太小而分數虛高"],"sec4_title":"參數卡","sec4_body":["param:λ|0.9|時間衰減","param:β|0.9|盲盒","param:γ|0.8|選段","param:v|0.2 / 0.1|主體段 / Encore 段","param:k|1|平滑分母","param:T|2026|今年"],"sec6_title":"已知偏差與數據來源","sec6_body":["h4:已知偏差與顯示","li:T04 萬紫千紅（2002）：演唱會實為 7 場，現存 5 場完整紀錄，分數按 5 場計算（已在該主題標注）。","li:係數為 0 表示這些年一次都沒唱過——不代表「沒人聽過」或「不好聽」，只是未被納入這 29 個主題的實際演出。","li:分數四捨五入到 4 位小數，部分曲目係數相同會並列同名次、名次跳號，屬設計而非錯誤。","h4:數據來源","數據來源：豆瓣演唱會 rundown 匯總帖（Billy 整理，https://www.douban.com/group/topic/44781860/）、維基百科、百 // ===== 视图切换 =====
function switchView(v){
  // 注意：必须用显式 'block' / 'none'，不能用 ''。
  // #alg-view 在样式表里有 display:none，置空内联样式会级联回落成 none，
  // 于是切到算法页时 list-view 被关、alg-view 又显示不出来 —— 整页空白。
  if(v==='list'){
    document.getElementById('list-view').style.display = 'block';
    document.getElementById('alg-view').style.display = 'none';
    document.getElementById('log-view').style.display = 'none';
  } else if(v==='alg'){
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('alg-view').style.display = 'block';
    document.getElementById('log-view').style.display = 'none';
    renderAlg();
  } else if(v==='log'){
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('alg-view').style.display = 'none';
    document.getElementById('log-view').style.display = 'block';
    renderLog();
  }
}

// ===== 算法与口径视图 =====
function renderAlg(){
  const alg = (lang==='hant') ? ALG_T : ALG_S;
  let h = '';
  ['sec1','sec2','sec3','sec4','sec5','sec6'].forEach(sk=>{
    const body = alg[sk+'_body'] || [];
    if(!alg[sk+'_title'] || !body.length) return;
    h += '<div class="alg-sec"><h3>' + alg[sk+'_title'] + '</h3>';
    let i = 0;
    while(i < body.length){
      const line = body[i];
      if(line.startsWith('h4:')){ h += '<h4>' + esc(line.slice(3)) + '</h4>'; i++; }
      else if(line.startsWith('fx:')){ h += '<p class="formula">' + esc(line.slice(3)) + '</p>'; i++; }
      else if(line.startsWith('li:')){ h += '<p class="li">' + esc(line.slice(3)) + '</p>'; i++; }
      else if(line.startsWith('param:')){
        let cells = '';
        while(i < body.length && body[i].startsWith('param:')){
          const p = body[i].slice(6).split('|');
          cells += '<div class="param-cell"><b>' + esc(p[1]||'') + '</b><small>' + esc(p[0]||'') + '</small><em>' + esc(p[2]||'') + '</em></div>';
          i++;
        }
        h += '<div class="param-grid">' + cells + '</div>';
      }
      else if(line.startsWith('kv:')){
        let cells = '';
        while(i < body.length && body[i].startsWith('kv:')){
          const p = body[i].slice(3).split('|');
          cells += '<div class="kv-row"><b>' + esc(p[0]||'') + '</b><span>' + esc(p[1]||'') + '</span></div>';
          i++;
        }
        h += '<div class="kv-grid">' + cells + '</div>';
      }
      else if(line.startsWith('wt:')){
        let rows = '';
        while(i < body.length && body[i].startsWith('wt:')){
          const p = body[i].slice(3).split('|');
          rows += '<div class="wt-row"><span>' + esc(p[0]||'') + '</span><b>' + esc(p[1]||'') + '</b></div>';
          i++;
        }
        h += '<div class="wt-table">' + rows + '</div>';
      }
      else if(line.startsWith('sc:')){
        let rows = '';
        while(i < body.length && body[i].startsWith('sc:')){
          const p = body[i].slice(3).split('|');
          const pct = (parseFloat(p[0])||0)*100;
          rows += '<div class="sc-row"><b>' + esc(p[0]||'') + '</b><div class="sc-bar"><i style="width:' + pct + '%"></i></div><span>' + esc(p[1]||'') + '</span></div>';
          i++;
        }
        h += '<div class="score-scale">' + rows + '</div>';
      }
      else { h += '<p>' + srcLink(line) + '</p>'; i++; }
    }
    h += '</div>';
  });
  document.getElementById('alg-content').innerHTML = h;
}

// ===== 榜单渲染（与 v1 相同）=====
const esc = t => String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 来源说明里的 URL 变可点链接：先 esc 再包 <a>，URL 经转义不会产生注入面
// ⚠ 本文件 TPL 是 string.Template，正文里的美元符号必须写成两个 ——
//   否则替身解析器会当成占位符名而抛 Invalid placeholder（注释里也不能出现单个）
const srcLink = t => esc(t).replace(/(https?:\/\/[^\s\uFF0C\u3001\uFF09\u300D)]+)/g,
  '<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmt = (n,d=4) => n==null?'—':Number(n).toFixed(d);
const fmtD = ds => ds.length ? ds.join('、') : '—';
const fmtDSList = ds => {
  if(!ds || !ds.length) return [];
  const out = []; let py = null;
  ds.forEach(d=>{ const y = d.slice(0,4); out.push(y===py ? d.slice(5).replace(/-/g,'/') : d.replace(/-/g,'/')); py = y; });
  return out;
};
let tpsOrder = 'contrib';
const sessOf = s => s[10].reduce((a,t)=>a+t[8].reduce((x,g)=>x+g[2].length,0),0);
const DMAP = {coef:{d:'desc'}, sess:{d:'desc'}, cnt:{d:'desc'}, year:{d:'asc'}, name:{d:'asc'}};

function dateBlock(cities, dates){
  const u = UI[lang];
  if(!cities || !cities.length) return '<div class="td">' + u.perf_title + '：' + esc(fmtD(dates)) + '</div>';
  let s = '<div class="td">';
  cities.forEach(function(g){
    const ct = g[0], vn = g[1], ds = g[2];
    // 按年份分组：同年合并（年份提左侧，日期只留 MM/DD），跨年也按组渲染，避免长日期挤爆栏宽
    const groups = [];
    ds.forEach(d => {
      const yr = d.slice(0,4);
      if(!groups.length || groups[groups.length-1].yr !== yr) groups.push({yr:yr, items:[]});
      groups[groups.length-1].items.push(d.slice(5).replace(/-/g,'/'));
    });
    let rows = '';
    groups.forEach(function(gr){
      rows += '<div class="loc-row">'
        + '<em class="yr">' + esc(gr.yr) + '</em>'
        + '<div class="dgrid">' + gr.items.map(d => '<span>' + esc(d) + '</span>').join('') + '</div>'
        + '</div>';
    });
    s += '<div class="loc">'
      +  '<div class="loc-rows">' + rows + '</div>'
      +  '<div class="loc-v">'
      +    (ct ? '<b>' + esc(ct) + '</b>' : '<b class="none">' + u.no_loc + '</b>')
      +    (vn ? '<i>' + esc(vn) + '</i>' : '')
      +  '</div>'
      +  '</div>';
  });
  return s + '</div>';
}

let pathMode = 'song';   // 'song' | 'crew'
let crewPick = -1;
let acList = [], PCS = [];

// PCS[范围][人员][角色]  范围 0=全部 1=有系数 2=无系数；角色 0=全部 1=填词 2=作曲 3=编曲 4=监制
// ⚠ 计数必须跟随「显示范围」，否则候选说 70 首、列表只出 45 首，数字对不上。
function buildPCNT(){
  PCS = [0,1,2].map(()=> PP.map(()=>[0,0,0,0,0]));
  function add(a, m){ a[0]++; if(m&1)a[1]++; if(m&2)a[2]++; if(m&4)a[3]++; if(m&8)a[4]++; }
  for(let i=0;i<PS.length;i++){
    const sp = PS[i] || [];
    const hasCoef = S[i] ? (S[i][2]||0) > 0 : false;
    for(let j=0;j<sp.length;j++){
      const pi = sp[j][0], m = sp[j][1];
      add(PCS[0][pi], m);
      if(hasCoef) add(PCS[1][pi], m); else add(PCS[2][pi], m);
    }
  }
}
// 人员显示名：繁体模式用繁体写法，简体模式用简体写法（匹配仍走全部写法）
function pname(pi){ return (lang==='hant') ? (PP[pi][1] || PP[pi][0]) : PP[pi][0]; }
function personHit(p, q){
  if(p[0].toLowerCase().indexOf(q)>=0) return true;
  if(p[1] && p[1].toLowerCase().indexOf(q)>=0) return true;
  for(let i=0;i<p[2].length;i++){ if(p[2][i].toLowerCase().indexOf(q)>=0) return true; }
  return false;
}
function hideAC(){
  document.getElementById('ac').className = 'acbox';
  acList = [];
}
function roleIdx(v){ return v==='1'?1:(v==='2'?2:(v==='4'?3:(v==='8'?4:0))); }
function updateAC(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  if(pathMode!=='crew' || !q){ hideAC(); return; }
  const ri = roleIdx(document.getElementById('role').value);
  const sc = document.getElementById('scope').value;
  const si = sc==='ranked' ? 1 : (sc==='zero' ? 2 : 0);
  const hits = [];
  for(let pi=0; pi<PP.length; pi++){
    if(!personHit(PP[pi], q)) continue;
    const n = PCS[si][pi] ? PCS[si][pi][ri] : 0;
    if(n>0) hits.push([pi, n]);
  }
  hits.sort((a,b)=> b[1]-a[1] || PP[a[0]][0].localeCompare(PP[b[0]][0]));
  acList = hits.slice(0, 15);
  const box = document.getElementById('ac');
  if(!acList.length){ box.className='acbox'; return; }
  const un = UI[lang].song_unit;
  box.innerHTML = acList.map(function(x){
    return '<div class="acitem" data-pi="'+x[0]+'"><span class="cn">'+esc(pname(x[0]))
      +'</span><span class="cc">'+x[1]+un+'</span></div>';
  }).join('');
  box.className = 'acbox on';
}
function pickAC(pi, keepInput){
  crewPick = pi;
  document.getElementById('q').value = pname(pi);
  hideAC();
  openIdx = -1; render();
}
function setPath(m){
  if(pathMode===m) return;
  pathMode = m;
  document.getElementById('path-song').className = (m==='song')?'on':'';
  document.getElementById('path-crew').className = (m==='crew')?'on':'';
  // ⚠ 必须用显式 'flex'/'none'：.fld 的 display 是 flex，置空会级联成 block
  document.getElementById('fld-era').style.display  = (m==='song')?'flex':'none';
  document.getElementById('fld-role').style.display = (m==='crew')?'flex':'none';
  document.getElementById('q').value = '';
  document.getElementById('era').value = '';
  document.getElementById('role').value = '';
  crewPick = -1; hideAC();
  applyUI();
  openIdx = -1; render();
}

let openIdx = -1;
function render(){
  const u = UI[lang];
  const q = document.getElementById('q').value.trim().toLowerCase();
  const scope = document.getElementById('scope').value;
  const sort = document.getElementById('sort').value;
  let arr = S.map((s,i)=>({s,i,k:sessOf(s)}));
  const era = document.getElementById('era').value;
  const role = document.getElementById('role').value;
  const rbit = Number(role||0);
  arr = arr.filter(({s,i})=>{
    if(scope==='ranked' && !(s[2]>0)) return false;
    if(scope==='zero'   &&  (s[2]>0)) return false;
    if(pathMode==='song'){
      if(q && s[0].toLowerCase().indexOf(q)<0) return false;
      if(era && String(s[3]||'').slice(0,3)!==era) return false;
    } else {
      const sp = PS[i] || [];
      let people = null;
      if(crewPick>=0){ people = [crewPick]; }
      else if(q){ people = []; for(let pi=0;pi<PP.length;pi++){ if(personHit(PP[pi],q)) people.push(pi); } }
      if(people){
        let ok = false;
        for(let j=0;j<sp.length;j++){
          if(people.indexOf(sp[j][0])>=0 && (!rbit || (sp[j][1]&rbit))){ ok=true; break; }
        }
        if(!ok) return false;
      } else if(rbit){
        let ok = false;
        for(let j=0;j<sp.length;j++){ if(sp[j][1]&rbit){ ok=true; break; } }
        if(!ok) return false;
      }
    }
    return true;
  });
  const cmpf = {
    coef: (a,b)=>(a.s[2]||0)-(b.s[2]||0),
    sess: (a,b)=>a.k-b.k,
    cnt : (a,b)=>a.s[10].length-b.s[10].length,
    year: (a,b)=>(a.s[3]||9999)-(b.s[3]||9999),
    name: (a,b)=>a.s[0].localeCompare(b.s[0], lang==='hant' ? 'zh-Hant' : 'zh-Hans')
  }[sort];
  const sign = sortDir==='desc' ? -1 : 1;
  arr.sort((a,b)=> sign*cmpf(a,b) || a.i-b.i);
  let cntTxt = '共 ' + arr.length + u.song_unit;
  if(pathMode==='crew' && crewPick>=0){
    const rl = {'1':u.role_lyr,'2':u.role_com,'4':u.role_arr,'8':u.role_pro}[role] || '';
    cntTxt += ' · ' + esc(pname(crewPick)) + (rl ? ' · ' + rl : '');
  }
  document.getElementById('cnt').textContent = cntTxt;
  const list = document.getElementById('list');
  if(!arr.length){ list.innerHTML = '<div class="empty">' + u.no_match + '</div>'; return; }
  list.innerHTML = arr.map(({s,i,k})=>{
    const [name,rank,coef] = s;
    const top = coef>0 && rank<=10;
    const isOpen = (openIdx===i);
    const lab = s[13] || '';
    const lc = LAB_COLOR[lab] || ['#F1EFE8','#5F5E5A'];
    const labSty = 'background:'+lc[0]+';color:'+lc[1];
    const labD = lab ? '<span class="lab lab-d" style="'+labSty+'">'+esc(lab)+'</span>' : '';
    const labM = lab ? '<span class="lab lab-m" style="'+labSty+'">'+esc(lab)+'</span>' : '';
    let h = '<div class="song'+(isOpen?' open':'')+'">'
      + '<div class="row" data-i="'+i+'">'
      + '<div class="rk'+(top?' top':'')+'">'+(coef>0?rank:'—')+'</div>'
      + '<div class="nm"><div class="nmh"><b>'+esc(name)+'</b>'+labD+'</div>'
      +   '<small title="' + esc(u.note_first + u.note_first_desc) + '">' + labM + u.first + ' '+(s[3]||'—')+(s[10].length?'　·　'+u.sung+' '+s[10].length+' '+u.themes+' · '+k+' '+u.shows:'　·　'+u.never)+'</small>'
      +   (coef>0?'<div class="meter"><i style="width:'+(coef/maxC*100).toFixed(1)+'%"></i></div>':'')
      + '</div>'
      + '<div class="cf">'+fmt(coef)+'<small>'+(coef>0?u.coef_label:u.unranked)+'</small></div>'
      + '</div>';
    if(isOpen) h += '<div class="detail">'+detail(s)+'></div>';
    h += '</div>';
    return h;
  }).join('');
  syncStickyH();
}

document.getElementById('list').addEventListener('click', e=>{
  const btn = e.target.closest('[data-tps]');
  if(btn){ tpsOrder = btn.dataset.tps; render(); return; }
  const row = e.target.closest('.row'); if(!row) return;
  const i = Number(row.dataset.i);
  openIdx = (openIdx===i) ? -1 : i;
  render();
  // 只把「点中的这一行」滚到可见：行本来就在视野内时完全不滚。
  // ⚠ 不能滚 .detail —— 详情区动辄 800+px，block:'nearest' 会把整页往下顶几百 px。
  // render() 重建了 list.innerHTML，旧的 row 已是游离节点，必须按 openIdx 重新取。
  if(openIdx>=0){
    const el = document.querySelector('.row[data-i="'+openIdx+'"]');
    if(el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
});
['q','scope','sort','era','role'].forEach(id=>{
  document.getElementById(id).addEventListener(id==='q'?'input':'change', ()=>{
    if(id==='sort'){ sortDir = DMAP[document.getElementById('sort').value].d; syncDir(); }
    if(id==='q'){ crewPick=-1; if(pathMode==='crew') updateAC(); }
    if((id==='role' || id==='scope') && pathMode==='crew' && crewPick<0) updateAC();
    openIdx=-1; render();
  });
});
document.getElementById('ac').addEventListener('mousedown', e=>{
  const it = e.target.closest('.acitem'); if(!it) return;
  e.preventDefault(); pickAC(Number(it.dataset.pi));
});
document.getElementById('q').addEventListener('blur', ()=>{ setTimeout(hideAC, 150); });
document.getElementById('dir').addEventListener('click', ()=>{
  sortDir = (sortDir==='desc') ? 'asc' : 'desc';
  syncDir(); render();
});

// ===== 初始化 =====
loadData();
buildPCNT();
// 按钮 class 需跟随 localStorage 里的 lang 同步（否则上次选繁体、这次打开内容繁体但按钮仍高亮简体）
document.getElementById('lang-hant').className = (lang==='hant') ? 'on' : '';
document.getElementById('lang-hans').className = (lang==='hans') ? 'on' : '';
applyUI();
syncDir();
render();
</script>
