<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><title>cloud sdk origin test</title></head>
<body>
<pre id="o">loading…</pre>
<script>
window.__R = {step: 'start', ok: false};
function log(s){ document.getElementById('o').textContent += '\n' + s; }
window.onerror = function(m){ window.__R = {step: 'js-error', ok: false, err: String(m)}; };
</script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"
        onerror="window.__R={step:'cdn-fail',ok:false,err:'sdk script failed to load'}"></script>
<script>
(async function(){
  if (!window.WorkBuddyCloud) { window.__R = {step:'no-global', ok:false}; return; }
  try {
    var cloud = WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: 'https://my-live-chart.app.workbuddy.host',
      oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
      publishableKey: 'wbpk_018ViedguliWmxg5imUr8p_7WBxPBTxA3IlICVsSnUwzoTTcGfojsZM'
    });
    var gid = crypto.randomUUID();
    var r = await cloud.database.from('wishes').insert({ gen_id: gid, song_name: '__sdk_origin_test__' });
    window.__R = {step:'insert', ok: !r.error, gen_id: gid,
                  err: r.error ? JSON.stringify(r.error).slice(0,400) : null,
                  status: (r.status||null)};
  } catch (e) {
    window.__R = {step:'throw', ok:false, err: String(e && (e.message||e)).slice(0,400)};
  }
  document.getElementById('o').textContent = JSON.stringify(window.__R, null, 1);
})();
</script>
</body></html>
